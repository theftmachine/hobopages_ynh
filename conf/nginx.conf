# HoboPages is a full-domain app: it owns the whole domain and routes
# /<site-name>/ to each published site itself.
location / {
    proxy_pass              http://127.0.0.1:__PORT__;
    proxy_http_version      1.1;

    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;

    # Uploads are streamed through rather than buffered to disk first.
    proxy_request_buffering off;
    client_max_body_size    64m;

    # Responses stream too, so range requests on video stay responsive.
    proxy_buffering         off;
    proxy_read_timeout      300s;
    proxy_send_timeout      300s;

    # HoboPages sets its own cache headers per file.
    proxy_hide_header       X-Powered-By;
}
